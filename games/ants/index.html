"use strict";
// ---------- settings ----------
const G = 32;              // picture is G x G pixels

const SOIL = "#3b2b1f", MOUND_FILL = "#7a5c42", MOUND_EDGE = "#94724f", HOLE_DARK = "#120b07", ANT = "#140c07";

// ---------- seeded random ----------
let seed = 0;
function rnd() { // mulberry32
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

// ---------- numbered levels: level n always builds the same puzzle ----------
function seedFor(n) {            // a fixed scramble of the level number
  let h = Math.imul((n + 1) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return h >>> 0;
}
const saved = {                  // progress, kept in this browser only
  get() { try { return parseInt(localStorage.getItem("ants.level"), 10) || 1; } catch (e) { return 1; } },
  set(n) { try { localStorage.setItem("ants.level", String(n)); } catch (e) {} },
};

const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

// ---------- pictures ----------
const COL = {
  sky: [124, 184, 232], blue: [46, 100, 204], navy: [34, 46, 110], teal: [36, 166, 152],
  green: [96, 178, 64], dkgreen: [38, 108, 52], yellow: [248, 208, 62], orange: [242, 132, 40],
  red: [218, 52, 46], pink: [238, 136, 176], purple: [132, 84, 186], brown: [136, 82, 40],
  tan: [218, 174, 112], white: [246, 242, 228], grey: [150, 152, 162], dkgrey: [64, 66, 78],
  maroon: [128, 34, 48], lilac: [196, 164, 226], mint: [156, 222, 186],

// each picture: its colours, and shapes painted in order, sampled at pixel centres
function picture(names, draw) {
  const px = new Int8Array(G * G), K = n => names.indexOf(n);
  const paint = (k, f) => { for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) if (f(x + 0.5, y + 0.5)) px[y * G + x] = K(k); };
  const inPoly = (pts, x, y) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  };
  const P = {
    all: k => paint(k, () => true),
    when: paint,
    rect: (k, x0, y0, x1, y1) => paint(k, (x, y) => x >= x0 && x < x1 && y >= y0 && y < y1),
    ell: (k, cx, cy, rx, ry) => paint(k, (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1),
    rell: (k, cx, cy, rx, ry, a) => paint(k, (x, y) => {
      const u = (x - cx) * Math.cos(a) + (y - cy) * Math.sin(a), v = -(x - cx) * Math.sin(a) + (y - cy) * Math.cos(a);
      return (u / rx) ** 2 + (v / ry) ** 2 <= 1;
    }),
    poly: (k, pts) => paint(k, (x, y) => inPoly(pts, x, y)),
    line: (k, x0, y0, x1, y1, w) => paint(k, (x, y) => {
      const dx = x1 - x0, dy = y1 - y0, t = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / (dx * dx + dy * dy)));
      return Math.hypot(x - x0 - t * dx, y - y0 - t * dy) <= w / 2;
    }),
    on: (k, olds, f) => { // repaint only pixels that currently have one of the given colours
      const set = [].concat(olds).map(K);
      for (let y = 0; y < G; y++) for (let x = 0; x < G; x++)
        if (set.includes(px[y * G + x]) && f(x + 0.5, y + 0.5)) px[y * G + x] = K(k);
    },
  };
  draw(P);
  return { pal: names.map(n => COL[n]), px };
}

  // columns: the front box, and two behind it
  for (let ci = 0; ci < COLUMNS; ci++)
    for (let j = Math.min(2, columns[ci].length - 1); j >= 0; j--) {
      const b = columns[ci][j], p = colPos(ci, j);
      drawBox(b, b.x, b.y, p.sz, false);
    }
  for (const a of ants) drawAnt(a);
}

// ---------- input ----------
cv.addEventListener("pointerdown", e => {
  if (state !== "play") return;
  const x = e.clientX, y = e.clientY;
  if (y < colY - s / 2 - 8) return;
  const half = (slotX[1] - slotX[0]) / 2;
  for (let ci = 0; ci < COLUMNS; ci++)
    if (Math.abs(x - slotX[ci]) <= half) { dockFront(ci); return; }
});
nextBtn.addEventListener("click", () => newLevel(state === "won" ? level % TOTAL + 1 : level));

// ---------- loop ----------
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  if (t - last >= 30) {                                     // about 30 frames a second is plenty
    last = t;
    for (let i = 0; i < SPEEDS[speedIdx]; i++) update(dt);   // faster = more steps per frame, same rules
    draw();
  }
  requestAnimationFrame(frame);
}
speedBtn.addEventListener("click", () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  speedBtn.textContent = SPEEDS[speedIdx] + "×";
});
addEventListener("resize", () => { layout(); });

newLevel(level);
requestAnimationFrame(t => { last = t; frame(t); });

try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {}); } catch (e) {}
</script>
</body>
