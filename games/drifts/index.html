<!DOCTYPE html>

<body>
<canvas id="c"></canvas>

<div id="lvl"></div>

<div id="end" class="hidden"><button id="next">next</button></div>
<script>
"use strict";
// ---------- settings ----------
const GW = 36, GH = 64, N = GW * GH;   // the landscape grid, in cells
const TOTAL = 200;                     // distinct levels
const TPS = 10;                        // simulation steps per second at 1×
const EMIT = 2;                        // each gap in the clouds lets a flake go every EMIT steps
const MELT = 0.02;                     // chance per step that a resting, uncovered snow cell melts
const MELT_T = Math.floor(MELT * 1073741824);
const TOP = 4;                         // rows under the clouds where fences may not go
const DIRS = [[1, 0], [1, 1], [0, 1], [1, -1]];   // fence angles: —  \  |  /
const GEN_T = 700, WIN0 = 450;         // level check: steps simulated, and the window where targets must stay full
const AIR = 0, GROUND = 1, ROCK = 2, PINE = 3, TRUNK = 4, WALL = 5, ROOF = 6, CHIMNEY = 7;

// ---------- dom ----------
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const endBox = document.getElementById("end");
const nextBtn = document.getElementById("next");
const speedBtn = document.getElementById("speed");
const lvlLabel = document.getElementById("lvl");
const hintBox = document.getElementById("hint");
const SPEEDS = [1, 2, 3, 5];
let speedIdx = 0;
const calm = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();

// ---------- seeded random ----------
let seed = 0;
function rnd() { // mulberry32
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(i, t) {            // fixed noise for melting: the same cell and step always give the same answer
  let h = Math.imul(i ^ 0x5bd1e995, 0x27d4eb2d) ^ Math.imul(t + 0x165667b1, 0x85ebca6b);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return h & 0x3fffffff;            // 30 bits: stays a small integer
}

// ---------- numbered levels: level n always builds the same puzzle ----------
function seedFor(n) {            // a fixed scramble of the level number
  let h = Math.imul((n + 1) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return h >>> 0;
}
const saved = {                  // progress, kept in this browser only
  get() { try { return parseInt(localStorage.getItem("drifts.level"), 10) || 1; } catch (e) { return 1; } },
  set(n) { try { localStorage.setItem("drifts.level", String(n)); } catch (e) {} },
};

// ---------- difficulty: more targets, more streams and rocks, fewer spare fences; a harder level every 5th ----------
function difficulty(n) {
  const hard = n > 4 && n % 5 === 0;
  const targets = Math.min(3, 1 + (n >= 6) + (n >= 30) + (hard ? 1 : 0));
  return {
    n, hard, targets,
    pockets: Math.min(6, targets + 2 + (targets >= 3 ? 1 : 0)),
    src: n < 6 ? 1 : Math.min(3, Math.max(1, targets - ri(0, 1) + (n >= 60 && rnd() < 0.3 ? 1 : 0))),
    rocks: n < 10 ? 0 : n < 35 ? ri(0, 1) : ri(1, 2) + (hard && n >= 60 ? 1 : 0),
    cup: n < 20 ? 0 : 0.5,
    pines: n < 5 ? ri(0, 1) : ri(1, 3),
    hillLo: n < 20 ? 14 : 16, hillHi: n < 20 ? 20 : 27,
    cliff: n < 20 ? 2 : 4, clump: n < 20 ? 0.2 : 0.55,
    pw: n < 40 ? 5 : 6,
    spare: n <= 30 || (n <= 60 && !hard) ? 1 : 0,
    maxF: targets + 2,
  };
}

// ---------- landscape: a hill stepping down to both edges, hollows, a cabin, pines, rock ledges ----------
function makeTerrain(D) {
  const stat = new Uint8Array(N), h = new Array(GW).fill(0), used = new Uint8Array(GW);
  const pw = ri(2, 5), pc = ri(6, GW - 7 - pw), top = ri(D.hillLo, D.hillHi);
  for (let x = pc; x < pc + pw; x++) h[x] = top;
  const steps = (len, drop) => {                  // drop spread over len columns, some steps grouped into cliffs
    const d = new Array(len).fill(0);
    let left = Math.min(drop, len * D.cliff - 1);
    for (let guard = 0; left > 0 && guard < 5000; guard++) {
      let k = ri(0, len - 1);
      if (rnd() < D.clump) { const has = d.map((v, i) => i).filter(i => d[i] > 0 && d[i] < D.cliff); if (has.length) k = has[ri(0, has.length - 1)]; }
      if (d[k] >= D.cliff) continue;
      d[k]++; left--;
    }
    return d;
  };
  const dl = steps(pc, top - ri(3, 7)), dr = steps(GW - pc - pw, top - ri(3, 7));
  for (let x = pc - 1; x >= 0; x--) h[x] = h[x + 1] - dl[pc - 1 - x];
  for (let x = pc + pw; x < GW; x++) h[x] = h[x - 1] - dr[x - pc - pw];
  for (let x = 0; x < GW; x++) h[x] = Math.max(2, h[x]);
  h[0] = Math.min(h[0], h[1]); h[GW - 1] = Math.min(h[GW - 1], h[GW - 2]);

  // the cabin first, on ground that is nearly level, away from the hilltop
  let cabin = null;
  for (let tries = 0; tries < 300 && !cabin; tries++) {
    const x0 = ri(1, GW - 9);
    if (!(x0 + 7 < pc || x0 - 1 > pc + pw - 1)) continue;
    let lo = 99, hi = 0;
    for (let x = x0; x <= x0 + 6; x++) { lo = Math.min(lo, h[x]); hi = Math.max(hi, h[x]); }
    if (hi - lo > 5 || GH - hi - 12 < TOP + 10) continue;
    for (let x = x0; x <= x0 + 6; x++) h[x] = hi;
    for (let x = x0 - 1; x <= x0 + 7; x++) used[x] = 3;
    cabin = { x0, yb: GH - hi };
  }

  // hollows dug into the ground; two hollows may share a rim
  const ground = [];
  for (let tries = 0; ground.length < D.pockets && tries < 400; tries++) {
    const w = ri(3, D.pw), x0 = ri(1, GW - 2 - w);
    let free = used[x0 - 1] < 2 && used[x0 + w] < 2;
    for (let x = x0; x < x0 + w; x++) if (used[x]) free = false;
    if (!free) continue;
    let base = 99;
    for (let x = x0 - 1; x <= x0 + w; x++) base = Math.min(base, h[x]);
    const f = base - ri(2, 3);
    if (f < 2) continue;
    for (let x = x0; x < x0 + w; x++) { h[x] = f; used[x] = 2; }
    used[x0 - 1] = Math.max(used[x0 - 1], 1); used[x0 + w] = Math.max(used[x0 + w], 1);
    ground.push({ x0, w, f });
  }
  for (let x = 0; x < GW; x++) for (let y = GH - h[x]; y < GH; y++) stat[y * GW + x] = GROUND;
  if (cabin) {
    const { x0, yb } = cabin, put = (x, y, k) => { if (x >= 0 && x < GW && y >= 0) stat[y * GW + x] = k; };
    for (let y = yb - 4; y < yb; y++) for (let x = x0; x <= x0 + 6; x++) put(x, y, WALL);
    for (let r = 0; r < 5; r++) for (let x = x0 - 1 + r; x <= x0 + 7 - r; x++) put(x, yb - 5 - r, ROOF);
    for (let y = yb - 10; y <= yb - 8; y++) put(x0 + 5, y, CHIMNEY);
  }

  // pines: a trunk and two tiers of branches
  const pines = [];
  for (let tries = 0; pines.length < D.pines && tries < 200; tries++) {
    const x = ri(3, GW - 4), big = rnd() < 0.5, widths = big ? [7, 5, 3, 5, 3, 1] : [5, 3, 1, 3, 1];
    const rad = (widths[0] - 1) / 2;
    let ok = true;
    for (let k = x - rad; k <= x + rad; k++) if (k < 0 || k >= GW || used[k]) ok = false;
    if (!ok) continue;
    const yb = GH - h[x], cells = [[x, yb - 1, TRUNK], [x, yb - 2, TRUNK]];
    widths.forEach((w, r) => { for (let k = -(w - 1) / 2; k <= (w - 1) / 2; k++) cells.push([x + k, yb - 3 - r, PINE]); });
    if (cells.some(([cx, cy]) => cy < TOP + 8 || stat[cy * GW + cx])) continue;
    for (const [cx, cy, k] of cells) stat[cy * GW + cx] = k;
    for (let k = x - rad; k <= x + rad; k++) used[k] = 1;
    pines.push(x);
  }

  // rock ledges jutting from the sides, some with a cup on top
  const cups = [], rockRows = [];
  for (let tries = 0; rockRows.length < D.rocks && tries < 200; tries++) {
    const left = rnd() < 0.5, len = ri(4, 8), cup = len >= 5 && rnd() < D.cup;
    const col = k => left ? k : GW - 1 - k;
    let lowest = 0;
    for (let k = 0; k < len + 2; k++) lowest = Math.max(lowest, h[col(k)]);
    const yMin = TOP + 6 + (cup ? 2 : 0), yMax = GH - lowest - 12;
    if (yMax < yMin) continue;
    const y = ri(yMin, yMax);
    if (rockRows.some(r => Math.abs(r - y) < 8)) continue;
    const cells = [];
    for (let k = 0; k < len; k++) cells.push([col(k), y]);
    for (let k = 0; k < len - 2; k++) cells.push([col(k), y + 1]);
    if (cup) for (const k of [0, len - 1]) { cells.push([col(k), y - 1]); cells.push([col(k), y - 2]); }
    if (cells.some(([cx, cy]) => stat[cy * GW + cx])) continue;
    for (const [cx, cy] of cells) stat[cy * GW + cx] = ROCK;
    rockRows.push(y);
    if (cup) { const c2 = []; for (let k = 1; k < len - 1; k++) for (const yy of [y - 2, y - 1]) c2.push(yy * GW + col(k)); cups.push(c2); }
  }

  // every hollow as a list of cells, up to the lower of its two rims
  const pockets = [];
  for (const g of ground) {
    const line = Math.min(h[g.x0 - 1], h[g.x0 + g.w]), cells = [];
    for (let x = g.x0; x < g.x0 + g.w; x++) for (let y = GH - line; y < GH - g.f; y++) cells.push(y * GW + x);
    pockets.push(cells);
  }
  pockets.push(...cups);

  const L = { stat, h, cabin, sources: [], pockets: pockets.map(cellsToPocket), targets: [], isPocket: new Uint8Array(N), isTarget: new Uint8Array(N) };
  for (const p of L.pockets) for (const i of p.cells) L.isPocket[i] = 1;
  return L;
}
function cellsToPocket(cells) {
  let x0 = GW, x1 = 0, top = GH;
  for (const i of cells) { x0 = Math.min(x0, i % GW); x1 = Math.max(x1, i % GW); top = Math.min(top, (i / GW) | 0); }
  return { cells, cx: (x0 + x1) / 2, top };
}

// ---------- the snow ----------
function newWorld(L, live) {
  const occ = new Uint8Array(N);       // 1 ground or rock, 2 fence, 3 snow: one array to check for open air
  for (let i = 0; i < N; i++) if (L.stat[i]) occ[i] = 1;
  return { snow: new Int32Array(N), occ, lo: new Int32Array(GH), hi: new Int32Array(GH), fence: new Int8Array(N).fill(-1), tick: 0, nextId: 1,
    emitK: L.sources.map(() => 0), fences: [], flow: null,
    offX: live ? new Int8Array(N) : null, offY: live ? new Int8Array(N) : null, ghosts: live ? [] : null };
}

// one step: flakes leave the gaps, fall, slide off slopes steeper than a diagonal, and resting uncovered snow melts now and then
// snow cells of each row as bits (lo: columns 0 to 29, hi: 30 and up; 30 bits keep the numbers small), so a step only visits snow
function snowOn(W, i) { const x = i % GW, y = (i / GW) | 0; if (x < 30) W.lo[y] |= 1 << x; else W.hi[y] |= 1 << (x - 30); }
function snowOff(W, i) { const x = i % GW, y = (i / GW) | 0; if (x < 30) W.lo[y] &= ~(1 << x); else W.hi[y] &= ~(1 << (x - 30)); }
function step(L, W) {
  const sn = W.snow, oc = W.occ, lo = W.lo, hi = W.hi, t = W.tick++, offX = W.offX, offY = W.offY, flow = W.flow;
  if (offX) { offX.fill(0); offY.fill(0); }
  if (t % EMIT === 0) for (let k = 0; k < L.sources.length; k++) {
    const s = L.sources[k], x = s.x + (W.emitK[k]++ % s.w);
    if (!oc[x]) { sn[x] = W.nextId++; oc[x] = 3; snowOn(W, x); if (offY) offY[x] = 1; }
  }
  const up = t & 1;                            // visit each row left to right or right to left, in turn
  for (let y = GH - 1; y >= 0; y--) {
    let ml = lo[y], mh = hi[y];
    if (!ml && !mh) continue;                  // a row of open air: nothing to do
    const row = y * GW;
    for (;;) {
      let x;
      if (up) {
        if (ml) { x = 31 - Math.clz32(ml & -ml); ml &= ml - 1; }
        else if (mh) { x = 61 - Math.clz32(mh & -mh); mh &= mh - 1; }
        else break;
      } else {
        if (mh) { const b = 31 - Math.clz32(mh); mh ^= 1 << b; x = b + 30; }
        else if (ml) { x = 31 - Math.clz32(ml); ml ^= 1 << x; }
        else break;
      }
      const i = row + x, id = sn[i];
      if (y === GH - 1) { sn[i] = 0; oc[i] = 0; snowOff(W, i); continue; }
      const b = i + GW;
      if (!oc[b]) {
        sn[b] = id; oc[b] = 3; sn[i] = 0; oc[i] = 0; snowOff(W, i); snowOn(W, b);
        if (offY) offY[b] = 1; if (flow) flow[b]++; continue;
      }
      const d0 = ((id + t) & 1) ? 1 : -1;
      let moved = false;
      for (let r = 0; r < 2; r++) {
        const d = r ? -d0 : d0, nx = x + d;
        if (nx < 0 || nx >= GW) { sn[i] = 0; oc[i] = 0; snowOff(W, i); moved = true; break; }   // off the edge of the land
        if (!oc[i + d] && !oc[b + d]) {                                // a diagonal step needs the side cell open too
          const sb = b + d;
          sn[sb] = id; oc[sb] = 3; sn[i] = 0; oc[i] = 0; snowOff(W, i); snowOn(W, sb);
          if (offX) { offX[sb] = d; offY[sb] = 1; } if (flow) flow[sb]++; moved = true; break;
        }
      }
      if (moved || y === 0) continue;
      if (!oc[i - GW] && hash(i, t) < MELT_T) { sn[i] = 0; oc[i] = 0; snowOff(W, i); if (W.ghosts) W.ghosts.push({ i, t: now }); }
    }
  }
}

function fenceCells(f) {
  const [dx, dy] = DIRS[f.a], out = [];
  for (let k = -2; k <= 2; k++) out.push([f.x + k * dx, f.y + k * dy]);
  return out;
}
// a fence fits where every cell is open air under the clouds, outside the outlines and other fences
function fenceFits(L, W, f, self, strict) {
  for (const [x, y] of fenceCells(f)) {
    if (x < 0 || x >= GW || y < TOP || y >= GH) return false;
    const i = y * GW + x;
    if (L.stat[i] || (strict ? L.isPocket[i] : L.isTarget[i])) return false;
    if (W.fence[i] >= 0 && W.fence[i] !== self) return false;
  }
  return true;
}
function setFences(L, W, list) {
  W.fences = list;
  for (let i = 0; i < N; i++) if (W.fence[i] >= 0) { W.fence[i] = -1; W.occ[i] = 0; }
  list.forEach((f, k) => {
    if (f.lifted) return;
    for (const [x, y] of fenceCells(f)) {
      const i = y * GW + x;
      if (W.snow[i]) { W.snow[i] = 0; snowOff(W, i); if (W.ghosts) W.ghosts.push({ i, t: now }); }
      W.fence[i] = k; W.occ[i] = 2;
    }
  });
}
const pocketFill = (W, p) => { let n = 0; for (const i of p.cells) if (W.snow[i]) n++; return n / p.cells.length; };

// ---------- level check: simulate, and see which hollows stay full ----------
function simulate(L, fences, T, opt) {
  const W = newWorld(L, false), P = L.pockets, pre = opt.pre || 0;
  if (opt.flow) W.flow = new Uint16Array(N);
  setFences(L, W, pre ? [] : fences);
  const sum = new Float64Array(P.length), full = new Float64Array(P.length);
  let samples = 0;
  for (let t = 0; t < pre + T; t++) {
    if (pre && t === pre) setFences(L, W, fences);
    step(L, W);
    const tt = t - pre;
    if (tt >= WIN0 && tt % 10 === 0) {
      samples++;
      for (let k = 0; k < P.length; k++) { const f = pocketFill(W, P[k]); sum[k] += f; if (f === 1) full[k]++; }
    }
  }
  for (let k = 0; k < P.length; k++) { sum[k] /= samples; full[k] /= samples; }
  return { avg: sum, full, flow: W.flow };
}
const robust = (res, ks) => ks.every(k => res.full[k] >= 0.6 && res.avg[k] >= 0.95);

// where snow can end up flowing, once every hollow is full: falls, slides down diagonals, spreads over flat tops
function fenceGrid(fences) {
  const g = new Int8Array(N).fill(-1);
  fences.forEach((f, k) => { for (const [x, y] of fenceCells(f)) g[y * GW + x] = k; });
  return g;
}
const RSOL = new Uint8Array(N), RQ = new Int32Array(N);
function reach(L, fences) {
  const sol = RSOL, q = RQ, seen = new Uint8Array(N);
  if (!L.solid0) { L.solid0 = new Uint8Array(N); for (let i = 0; i < N; i++) L.solid0[i] = L.stat[i] || L.isPocket[i] ? 1 : 0; }
  sol.set(L.solid0);
  for (const f of fences) { const [dx, dy] = DIRS[f.a]; for (let k = -2; k <= 2; k++) sol[(f.y + k * dy) * GW + f.x + k * dx] = 1; }
  let n = 0;
  for (const s of L.sources) for (let x = s.x; x < s.x + s.w; x++) if (!sol[x] && !seen[x]) { seen[x] = 1; q[n++] = x; }
  while (n) {
    const i = q[--n], x = i % GW, b = i + GW;
    if (b >= N) continue;
    if (!sol[b]) { if (!seen[b]) { seen[b] = 1; q[n++] = b; } continue; }
    let slid = false;
    if (x === 0) slid = true;
    else if (!sol[i - 1] && !sol[b - 1]) { slid = true; if (!seen[b - 1]) { seen[b - 1] = 1; q[n++] = b - 1; } }
    if (x === GW - 1) slid = true;
    else if (!sol[i + 1] && !sol[b + 1]) { slid = true; if (!seen[b + 1]) { seen[b + 1] = 1; q[n++] = b + 1; } }
    if (!slid) {                                   // resting: the pile spreads sideways over a flat top
      if (x > 0 && !sol[i - 1] && !seen[i - 1]) { seen[i - 1] = 1; q[n++] = i - 1; }
      if (x < GW - 1 && !sol[i + 1] && !seen[i + 1]) { seen[i + 1] = 1; q[n++] = i + 1; }
    }
  }
  return seen;
}
function fedBy(L, seen) {            // hollows that snow reaches from above
  const out = [];
  L.pockets.forEach((p, k) => { if (p.cells.some(i => i >= GW && seen[i - GW])) out.push(k); });
  return out;
}

// a fence on the snow's path, leaning so the snow slides toward hollow P
function pickFence(L, P, seen, fences) {
  const W = { fence: fenceGrid(fences) }, cand = [];
  for (let y = TOP + 2; y <= P.top - 3; y++) for (let x = 0; x < GW; x++)
    if (seen[y * GW + x] && Math.abs(x - P.cx) <= 16) cand.push(y * GW + x);
  if (!cand.length) return null;
  for (let tries = 0; tries < 20; tries++) {
    const i = cand[ri(0, cand.length - 1)], x = i % GW, y = (i / GW) | 0, r = rnd();
    let f;
    if (r < 0.15) f = { x: x + ri(-2, 2), y, a: 0 };
    else if (r < 0.22) f = { x: x + (P.cx > x ? 1 : -1), y: y + ri(0, 2), a: 2 };

// builds a known solution: fences go one at a time on the snow's path, keeping the one that fills the most hollows
const BUDGET0 = 150;

    if (fedBy(L, reach(L, [])).length > L.pockets.length - D.targets) continue;   // too many hollows on the snow's way

function generate(n) {

    if (!sol) continue;
    const easyOk = n > 3 || sol.fences.length === 1;
    const score = sol.targets.length * 10 + (easyOk ? 5 : 0) - sol.fences.length;

  if (state !== "play" || drag) return;
  const px = e.clientX, py = e.clientY, fi = hitFence(px, py);
  if (fi >= 0) { const f = Wd.fences[fi], g = toCell(px, py); drag = { kind: "fence", f, sx: px, sy: py, dx: f.x - g.x, dy: f.y - g.y }; }
  else if (inTray(px, py) && supply() > 0) drag = { kind: "tray", f: null, sx: px, sy: py };
  else if (inField(px, py)) drag = { kind: "tap", sx: px, sy: py };
  else return;
  drag.moved = false; drag.overTray = false;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const px = e.clientX, py = e.clientY;
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) > 8) {
    drag.moved = true;
    if (drag.kind === "fence") { drag.f.lifted = true; setFences(L, Wd, Wd.fences); }
  }
  if (!drag.moved) return;
  const g = toCell(px, py);
  drag.overTray = inTray(px, py);
  if (drag.kind === "fence") {
    const nf = { x: g.x + drag.dx, y: g.y + drag.dy, a: drag.f.a };
    if (fenceFits(L, Wd, nf, -1, false)) { drag.f.x = nf.x; drag.f.y = nf.y; }
  } else if (drag.kind === "tray" && inField(px, py)) {
    const nf = { x: g.x, y: g.y - 2, a: 0 };
    if (fenceFits(L, Wd, nf, -1, false)) {
      if (!drag.f) { drag.f = { x: nf.x, y: nf.y, a: 0, lifted: true }; Wd.fences.push(drag.f); }
      else { drag.f.x = nf.x; drag.f.y = nf.y; }
    }
  }
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.kind === "fence" || d.kind === "tray") {
    if (d.kind === "fence" && !d.moved && !cancel) { rotateFence(d.f); return; }
    if (d.f) {
      if (d.overTray && !cancel) Wd.fences.splice(Wd.fences.indexOf(d.f), 1);
      else d.f.lifted = false;
      setFences(L, Wd, Wd.fences);
    }
  } else if (d.kind === "tap" && !d.moved && !cancel) addFenceNear(toCell(d.sx, d.sy));
}
cv.addEventListener("pointerup", e => endDrag(e, false));
cv.addEventListener("pointercancel", e => endDrag(e, true));
nextBtn.addEventListener("click", () => newLevel(level % TOTAL + 1));
speedBtn.addEventListener("click", () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  speedBtn.textContent = SPEEDS[speedIdx] + "×";
});
addEventListener("resize", layout);

// ---------- loop ----------
let last = 0, acc = 0;
function frame(t) {
  if (t - last >= 30) {                                     // about 30 frames a second is plenty
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t; now = t;
    acc += dt * TPS * SPEEDS[speedIdx];                     // faster = more steps per second, same rules
    for (let n = 0; acc >= 1 && n < 20; n++) { tick(); acc -= 1; }
    acc = Math.min(acc, 1);
    if (state === "won" && endBox.classList.contains("hidden") && (endTimer += dt) > 1) endBox.classList.remove("hidden");
    draw(acc);
  }
  requestAnimationFrame(frame);
}

newLevel(level);
requestAnimationFrame(t => { last = t; now = t; frame(t); });

try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {}); } catch (e) {}
</script>
